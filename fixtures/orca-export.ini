# Fixture: a print preset in the shared PrusaSlicer/OrcaSlicer dialect, saved the
# way Orca writes it. Names are Orca's; several are renames of engine settings,
# several are engine settings this engine does not implement yet, and one is a
# Bambu-fork name that is not part of the dialect at all.
name = 0.20mm Voron Quality
inherits = 0.20mm Standard

layer_height = 0.2
initial_layer_print_height = 0.25
wall_loops = 4
sparse_infill_density = 18%
sparse_infill_pattern = gyroid
top_shell_layers = 4
bottom_shell_layers = 3
outer_wall_speed = 120
inner_wall_speed = 180
sparse_infill_speed = 220
internal_solid_infill_speed = 180
initial_layer_speed = 45
travel_speed = 400
nozzle_temperature = 215
nozzle_temperature_initial_layer = 220
hot_plate_temp = 60
close_fan_the_first_x_layers = 2
enable_support = 1
support_type = tree(auto)
support_threshold_angle = 30

arc_fitting = disabled
ensure_vertical_shell_thickness = ensure_moderate
enable_arc_fitting = 1
adaptive_layer_height = 0
input_shaping_freq_x = 34.4
