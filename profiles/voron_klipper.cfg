# Voron 2.4 350, single extruder, Klipper, 0.4 mm nozzle, PLA.
#
# This profile assumes two things exist on the machine: a PRINT_START macro and
# Klipper's SET_PRESSURE_ADVANCE. Every Voron config has both. If yours does not,
# replace the start_gcode block with the inline sequence in the comment below it.

name = voron_klipper
flavor = klipper
relative_e = true
origin_center = false

bed_x = 350
bed_y = 350
max_z = 320

nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.24
line_width = 0.4
min_bead_width = 0.2
layer_height = 0.2
first_layer_height = 0.2
walls = 2
infill_density = 0.15
infill_pattern = rectilinear
top_layers = 5
bottom_layers = 4

nozzle_temp = 210
first_nozzle_temp = 215
bed_temp = 60
fan_speed = 100
fan_start_layer = 2

retract_len = 0.5
retract_speed = 35
retract_min_travel = 1.5
infill_retract_min_travel = 12
z_hop = 0.2

travel_speed = 200
avoid_crossing_perimeters = true
avoid_crossing_perimeters_max_detour = 2
first_layer_speed = 25
outer_wall_speed = 60
inner_wall_speed = 100
thin_speed = 40
infill_speed = 120
solid_speed = 80
max_volumetric_speed = 15
max_speed = 300
# The acceleration the print runs at between features. Stating it is what lets a
# per-feature figure be applied and handed back: with no base here the engine sends
# no SET_VELOCITY_LIMIT at all and leaves the machine's own limit alone, and a
# bridge's 3000 would otherwise stay in force for the rest of the print.
default_accel = 5000
min_layer_time = 8
min_speed_factor = 0.3

flow = 0.95
seam = aligned
inner_walls_first = true
skirt_loops = 2
skirt_distance = 4
brim_loops = 0
brim_gap = 0.1
# Distance from the nozzle tip to the lowest part of the moving gantry, in
# millimetres, measured on this machine with the head at Z 0. It decides whether
# print_sequence = by object can pass over a finished part: the gantry moves
# down with Z on a CoreXY, so a part taller than this cannot be printed and then
# stepped over. 0 means unmeasured, and by-object printing refuses to run rather
# than guess — a wrong guess drives the gantry through the part.
# Measure: HOME, lower Z until the nozzle touches the bed, then measure the gap
# under the X extrusion (and under the Z belt anchors, whichever is lower).
gantry_height = 0
bridge_speed = 40
# Material per bridge line, on top of flow. Both reference slicers default to
# 1.0; below 1.0 sags less and leaves the bead short of its neighbours' edges.
bridge_flow = 1.0
# Line spacing as a fraction of bead width. Above 1.0 overlaps neighbouring
# beads so the layer forms a continuous sheet instead of a comb.
bridge_density = 1.05
# 0 uses line_width.
bridge_line_width = 0
# -1 chooses the direction per layer from the anchor geometry; set 0, 45, 90 or
# 135 to force one.
bridge_angle = -1
# One nozzle diameter of material per bridge line instead of one layer height.
thick_bridges = 0
# Two crossing strands across each gap, printed before the fill lines. The fill
# then spans material rather than bare air, at the cost of two beads that sag on
# their own. Off by default; the 50 mm envelope test turns it on.
bridge_cross_hatch = 0
bridge_fan_speed = 100
# A bridge is printed at low speed, so 3000 mm/s^2 is plenty and it stops the
# machine from overshooting the anchor at each end. 0 leaves Klipper alone.
bridge_acceleration = 3000
# 0 bridges whatever the model has. Set this when a span is known to sag beyond
# repair: those lines print as ordinary solid infill instead of a slow bridge.
max_bridge_length = 0
# Span compensation, per millimetre past bridge_span_ref. Both slicers under
# comparison use one flow for every span. This one thins the bead as the span
# grows, because a drooping bridge hangs from its own mass: 0.9x flow at 30 mm
# beats the 1.1x that sagged in the first 30 mm test.
bridge_span_ref = 5
bridge_span_flow = -0.004
bridge_span_speed = 0.01
# Supports. Off by default: the first version generates normal columns only, and
# the span-budgeted planner in docs/SUPPORTS.md has to earn its place on
# hardware before it becomes the default.
support = 0
# Steepest overhang printed without support, in degrees from vertical. Bridging
# is decided separately by the air mask, so this only decides seeds.
support_threshold_angle = 60
# Clearances against the part. The Z gap is rounded to whole layers.
support_xy_gap = 0.35
support_z_gap = 0.2
# Dense cap immediately under the contact surface.
support_interface_layers = 2
support_density = 0.15
support_interface_density = 0.8
# 0 lets a column rest on the part; 1 drops any column that would have to.
support_on_build_plate_only = 0
# Overhang patches smaller than this are ignored, in square millimetres.
support_min_area = 2
support_speed = 60
support_interface_speed = 40
# normal projects columns straight down; tree grows tips down and lets them
# lean, merge and thicken into trunks. Tree geometry below is ignored by normal.
support_style = normal
# Steepest a branch may lean from vertical. Bound by the beads' own overhang
# limit, so a branch never needs support under itself.
support_branch_angle = 40
# Branches closer than this start converging; contact tips are sampled at half
# this distance, so the two are tied together.
support_branch_distance = 3
# Contact tip at the overhang, and how fast a trunk cones out on the way down.
support_tip_diameter = 0.8
support_branch_diameter_angle = 2
support_max_branch_diameter = 8
emit_print_stats = true
# false because this machine's printer.cfg has no [exclude_object] section, and
# EXCLUDE_OBJECT_DEFINE is an unknown command without it: Klipper would abort the
# print on that line. Set it back to true only after adding [exclude_object] to
# printer.cfg (which is also what KAMP's purge macros need).
exclude_object = false

# 0.045 is a safe starting value for PLA on a 0.4 mm nozzle. Calibrate it with
# OrcaSlicer's pressure advance test and put the measured value here.
pressure_advance = 0.045

# Alternative to the macro call, if the machine has no PRINT_START:
#   M140 S{bed_temp}
#   M104 S150
#   G28
#   QUAD_GANTRY_LEVEL
#   G28 Z
#   BED_MESH_CALIBRATE
#   M190 S{bed_temp}
#   M109 S{first_nozzle_temp}
start_gcode = <<END_START
PRINT_START BED={bed_temp} EXTRUDER={first_nozzle_temp}
END_START

end_gcode = <<END_END
G91
G1 Z10 F600
G90
PRINT_END
M104 S0
M140 S0
M107
M84
END_END
