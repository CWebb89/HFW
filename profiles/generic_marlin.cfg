# Generic single-extruder printer, Marlin dialect, 0.4 mm nozzle, PLA.
# Copy this file and edit the four settings marked EDIT for your machine.

name = generic_marlin
flavor = marlin
relative_e = true
origin_center = false

# EDIT: print volume in millimetres
bed_x = 220
bed_y = 220
max_z = 250

nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.24
line_width = 0.4
min_bead_width = 0.2
layer_height = 0.2
first_layer_height = 0.2
walls = 3
infill_density = 0.15
infill_pattern = rectilinear
top_layers = 5
bottom_layers = 4

# EDIT: temperatures for your filament
nozzle_temp = 210
first_nozzle_temp = 215
bed_temp = 60
fan_speed = 100
fan_start_layer = 2

retract_len = 0.8
retract_speed = 35
retract_min_travel = 1.5
infill_retract_min_travel = 12
z_hop = 0

travel_speed = 150
first_layer_speed = 20
outer_wall_speed = 40
inner_wall_speed = 60
thin_speed = 30
infill_speed = 80
solid_speed = 60
max_volumetric_speed = 12
max_speed = 300
min_layer_time = 8
min_speed_factor = 0.25

flow = 0.95
seam = aligned
inner_walls_first = true
skirt_loops = 2
skirt_distance = 3
emit_print_stats = false
exclude_object = false
pressure_advance = 0

start_gcode = <<END_START
M140 S{bed_temp}
M104 S150
G28
M190 S{bed_temp}
M109 S{first_nozzle_temp}
END_START

end_gcode = <<END_END
M104 S0
M140 S0
M107
M84
END_END
